{% extends "base.html" %}
{% block title %}تسجيل مستند جديد{% endblock %}
{% block page_title %}تسجيل مستند وربطه بموضوع{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="max-w-3xl bg-white border border-[#ECEFF1] rounded-2xl p-6 space-y-4 text-xs">
    {% csrf_token %}
    <div>
        <label class="block font-bold text-[#444746] mb-1">عنوان المستند *</label>
        <input type="text" name="title" required class="w-full px-3.5 py-2 border border-[#DADCE0] rounded-xl text-sm">
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block font-bold text-[#444746] mb-1">الموضوع المرتبط</label>
            <select name="subject_id" class="w-full px-3 py-2 border border-[#DADCE0] rounded-xl bg-white">
                <option value="">-- تسجيل مستقل ثم الربط لاحقاً --</option>
                {% for s in subjects %}
                    <option value="{{ s.id }}" {% if selected_subject and selected_subject.id == s.id %}selected{% endif %}>{{ s.internal_number }} — {{ s.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block font-bold text-[#444746] mb-1">نوع المستند *</label>
            <select name="doc_type_id" required class="w-full px-3 py-2 border border-[#DADCE0] rounded-xl bg-white">
                {% for dt in doc_types %}<option value="{{ dt.id }}">{{ dt.name }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="block font-bold text-[#444746] mb-1">مصدر المستند</label>
            <select name="source_type" class="w-full px-3 py-2 border border-[#DADCE0] rounded-xl bg-white">
                <option value="INCOMING">وارد</option>
                <option value="OUTGOING">صادر</option>
                <option value="INTERNAL">داخلي</option>
            </select>
        </div>
        <div>
            <label class="block font-bold text-[#444746] mb-1">رقم الصادر / الوارد الخارجي</label>
            <input type="text" name="external_in_out_number" class="w-full px-3 py-2 border border-[#DADCE0] rounded-xl">
        </div>
        <div>
            <label class="block font-bold text-[#444746] mb-1">الجهة المرسلة</label>
            <input type="text" name="sender_entity" class="w-full px-3 py-2 border border-[#DADCE0] rounded-xl">
        </div>
        <div>
            <label class="block font-bold text-[#444746] mb-1">درجة السرية *</label>
            <select name="confidentiality_id" required class="w-full px-3 py-2 border border-[#DADCE0] rounded-xl bg-white">
                {% for c in confidentialities %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </select>
        </div>
    </div>
    <div>
        <label class="block font-bold text-[#444746] mb-1">المرفقات (يمكن اختيار أكثر من ملف: PDF, صور, Word, Excel — يُحفظ ببصمة SHA-256)</label>
        <input type="file" name="attachment_file" multiple class="w-full text-[#444746]">
    </div>
    <div>
        <label class="block font-bold text-[#444746] mb-1">ملخص المحتوى</label>
        <textarea name="summary" rows="3" class="w-full px-3 py-2 border border-[#DADCE0] rounded-xl"></textarea>
    </div>
    <button type="submit" class="px-6 py-2 bg-[#0B57D0] hover:bg-[#0842A0] text-white rounded-full text-xs font-bold">تسجيل المستند</button>
</form>
{% endblock %}
