{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="gmail" data-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — البريد الإداري</title>
    <script>
    (function () {
        try {
            var m = localStorage.getItem('correspondence_color_mode') === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', 'gmail');
            document.documentElement.setAttribute('data-mode', m);
            if (m === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="app-shell-bg bg-[#F6F8FC] min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-md bg-white border border-[#E1E3E1] rounded-3xl p-8 shadow-sm space-y-6">
    <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-3">
            <svg class="w-9 h-9 shrink-0" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <rect x="3" y="6" width="26" height="20" rx="4" fill="#FFFFFF" stroke="#DADCE0"/>
                <path d="M4 9L16 18L28 9" stroke="#EA4335" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 23V10" stroke="#1A73E8" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M28 23V10" stroke="#34A853" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div>
                <h1 class="text-xl font-bold text-[#1F1F1F]">البريد الإداري</h1>
                <p class="text-sm text-[#5F6368]">سجّل دخولك لمتابعة معاملاتك اليومية</p>
            </div>
        </div>
        <button type="button" id="color-mode-toggle" onclick="toggleAppColorMode()" class="px-3 py-1.5 rounded-full border border-[#DADCE0] text-xs font-bold text-[#5F6368] hover:bg-[#F1F3F4] shrink-0">
            <span id="theme-icon-moon">الوضع الداكن</span>
            <span id="theme-icon-sun" class="hidden">الوضع الفاتح</span>
        </button>
    </div>

    {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
                <div class="p-3.5 rounded-2xl bg-[#FFF9F2] border border-[#F0DCB8] text-[#8B5014] text-sm font-bold">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-bold text-[#1F1F1F] mb-1.5">اسم المستخدم</label>
            <input type="text" name="username" required autofocus placeholder="اكتب اسم المستخدم الخاص بك" class="w-full px-4 py-3 border border-[#DADCE0] rounded-xl text-[15px] focus:outline-none focus:border-[#0B57D0]">
        </div>
        <div>
            <label class="block text-sm font-bold text-[#1F1F1F] mb-1.5">كلمة المرور</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 border border-[#DADCE0] rounded-xl text-[15px] focus:outline-none focus:border-[#0B57D0]">
        </div>
        <button type="submit" class="w-full py-3 bg-[#0B57D0] hover:bg-[#0842A0] text-white font-bold rounded-full text-[15px] transition-colors">
            دخول إلى النظام
        </button>
    </form>

    <div class="pt-4 border-t border-[#ECEFF1] text-xs text-[#5F6368] leading-relaxed text-center">
        نظام المراسلات والدورة المستندية — جميع العمليات محمية وموثقة
    </div>
</div>
<script src="{% static 'js/gmail_ui.js' %}"></script>
</body>
</html>
