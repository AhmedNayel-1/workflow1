{% for n in nodes %}<details class="rf-node" open data-rf-t="{{ n.unit.name }}"><summary class="rf-sum">{% if n.selectable %}<label class="rf-opt rf-unit" data-rf-t="{{ n.unit.name }}"><input type="checkbox" name="target_unit_ids" value="{{ n.unit.id }}"> <span>{{ n.unit.name }} <small>(الوحدة كلها)</small></span></label>{% else %}<b>{{ n.unit.name }}</b>{% endif %}</summary>
  <div class="rf-kids">{% for u in n.users %}<label class="rf-opt" data-rf-t="{{ u.get_full_name|default:u.username }} {{ u.job_display_title|default:'' }}"><input type="checkbox" name="target_user_ids" value="{{ u.id }}"> <span>{{ u.get_full_name|default:u.username }}{% if u.job_display_title %} <small>— {{ u.job_display_title }}</small>{% endif %}</span></label>{% endfor %}
  {% if n.children %}{% include "workflow/_pick_node.html" with nodes=n.children %}{% endif %}</div></details>{% endfor %}
